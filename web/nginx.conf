server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
